[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-plugins-toolkit"
version = "0.2.0"
description = "Vendor-neutral toolkit for composable, testable and distributable agentic plugins"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vladimir Acuña" }]
dependencies = []
keywords = ["agentic-plugins", "claude-code", "mcp", "openai-plugins", "agent-skills", "llm-tooling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/vladimiracunadev-create/agentic-plugins-toolkit"
Documentation = "https://github.com/vladimiracunadev-create/agentic-plugins-toolkit/blob/main/docs/CLI.md"
Changelog = "https://github.com/vladimiracunadev-create/agentic-plugins-toolkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/vladimiracunadev-create/agentic-plugins-toolkit/issues"

[project.optional-dependencies]
dev = ["ruff>=0.13"]

[project.scripts]
agentic-plugins = "agentic_plugins.cli:main"
agentic-plugins-hook = "agentic_plugins.hooks:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "N", "PTH", "ARG"]
ignore = [
  "E501",  # la longitud de línea la fija el formateador, no el linter
]

[tool.ruff.lint.per-file-ignores]
# Ambos ajustan sys.path antes de importar el paquete local: el import no puede
# preceder al bootstrap.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
# render.py lee el código fuente de policy._matches para copiarlo literalmente en
# los servidores autocontenidos; ese acceso al miembro privado es el mecanismo
# que impide que la CLI y el paquete distribuido diverjan.
"src/agentic_plugins/render.py" = ["SLF001"]
